<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chess IA</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      background: #0b091d;
      color: white;
      font-family: Arial;
    }

    h1 {
      color: #c5efe6;
      text-align: center;
      font-size: 48px;
      margin-top: 80px;
    }

    h2 {
      text-align: center;
      color: white;

    }

    #botao-config {
      background: #4848656a;
      border: none;
      border-radius: 100%;
      font-size: 40px;
      position: fixed;
      top: 24px;
      right: 25px;
    }

    #botao-config:active {
      background: #0c101c;
    }

    .opcao-botao {
      color: white;
      background: #272d3c;
      border: none;
      border-radius: 59px;
      width: 85%;
      font-size: 50px;

      display: block;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 10px;
    }

    #painel-config {
      display: none;
      z-index: 11;

      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 80%;
      max-width: 365px;

      background-color: #151922;
      color: white;

      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 40px #00000080;
    }

    #botao-song {
      position: absolute;
      top: 10px;
      left: 10px;

      background: #272d3c;
      border: none;
      font-size: 40px;
      border-radius: 50%;
    }

    .opcao-botao:active {
      background: #252d3c44;
    }

    #botao-song:active {
      background: #252d3c44;
    }

    #fundo-config {
      display: none;
      z-index: 10;

      position: fixed;
      inset: 0;

      background-color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body>

  <audio id="musica" src="./song.mp3" loop></audio>
  <audio id="som-click" src="./click.mp3"></audio>

  <h1>Chess IA</h1>
  <button id="botao-config">⚙️</button>

  <div id="fundo-config"></div>

  <div id="painel-config">
    <h2>Configuraçoes</h2>

    <button class="opcao-botao" id="botao-tema">🎨Tema</button>
    <button class="opcao-botao" id="botao-idioma">🗣️Idioma</button>
    <button id="botao-song">🔊</button>
  </div>
  <script>
    const musica =document.getElementById("musica");
    const botaoSom =document.getElementById("som-click");
    
    const botao = document.getElementById("botao-config");
    const fundo = document.getElementById("fundo-config");
    const painel = document.getElementById("painel-config");

    const tema = document.getElementById("botao-tema")
    const idioma = document.getElementById("botao-idioma")
    const song = document.getElementById("botao-song")

    let musicaLigada = false;

    function alternarMusica() {
      if (musicaLigada) {
        musica.pause();
        musicaLigada = false;
        botaoSom.textContent = "🔇";
      } else {
        musica.play();
        musicaLigada = true;
        botaoSom.textContent = "🔊";
      }
    }
    
    function abrirConfig() {
      painel.style.display = "block";
      fundo.style.display = "block";
    }

    function fecharConfig() {
      painel.style.display = "none";
      fundo.style.display = "none";
    }

    botaoSom.onclick = alternarMusica;
    botao.onclick = abrirConfig;
    fundo.onclick = fecharConfig;

  </script>
</body>

</html>
